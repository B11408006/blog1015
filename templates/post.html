
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>{{ post.title }}</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>{{ post.title }}</h1>

        <p>作者：{{ post.author }}</p>

        <hr>

        <div class="content">
            {{ post.content }}
        </div>

        <p>
            <a href="{{ url_for('index') }}">返回首頁</a>
        </p>
    </div>
</body>
</html>
